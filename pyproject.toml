[project]
name = "realtime-social-dilemma"
version = "0.2.0"
description = "Replication analyses for real-time interaction and voluntary early cooperation"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "scipy>=1.15,<2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
